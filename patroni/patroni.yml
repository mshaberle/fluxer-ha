#
# fluxer-ha: see docs/architecture.md.
# Per-node values come from the environment, set in ha.compose.yml:
#   PATRONI_NAME, PATRONI_RESTAPI_CONNECT_ADDRESS, PATRONI_POSTGRESQL_CONNECT_ADDRESS,
#   PATRONI_ETCD3_HOSTS, PATRONI_SUPERUSER_*, PATRONI_REPLICATION_*,
#   PATRONI_RESTAPI_USERNAME/PASSWORD (Basic auth on the REST API's unsafe
#   methods: POST/PUT/PATCH/DELETE; GETs such as /primary stay open),
#   PATRONI_ETCD3_USERNAME/PASSWORD (etcd RBAC, fluxer-ha/etcd-auth.sh)
# These override the matching keys in this file (patroni/config.py,
# _build_environment_configuration; checked in the lab on 2026-10-15).
# entrypoint.py adds the per-site pg_hba lines and starts Patroni with the result.

scope: fluxer
namespace: /fluxer/

restapi:
  listen: 0.0.0.0:8008

etcd3:
  protocol: http

bootstrap:
  dcs:
    # loop_wait + 2 * retry_timeout must be <= ttl.
    # A dead primary is detected and replaced within about ttl seconds.
    ttl: 20
    loop_wait: 5
    retry_timeout: 5
    # Only a synchronous standby may be promoted automatically, so an
    # automatic failover never loses an acknowledged commit. When the standby
    # is gone, Patroni drops to async (strict=false) so the primary keeps
    # accepting writes.
    synchronous_mode: true
    synchronous_mode_strict: false
    # If etcd is unavailable but both Postgres nodes can still talk to each
    # other, keep the current primary running instead of demoting it.
    failsafe_mode: true
    # Keep a missing member's replication slot (and so the WAL it needs) for a
    # day, so a spare that was down for less than that just catches up. The
    # default, 30 min, left a spare powered off for 45 min unable to catch up
    # at all (lab F35). max_slot_wal_keep_size below caps the disk it can take;
    # past either limit, ha-health.sh re-clones the spare automatically.
    member_slots_ttl: 24h
    postgresql:
      use_pg_rewind: true
      use_slots: true
      parameters:
        # The same tuning as upstream's docker-compose.yml (postgres command),
        # plus what replication and pg_rewind need.
        wal_level: replica
        wal_log_hints: "on"
        # A standby that vanishes silently (dropped packets) holds up synchronous
        # commits until the walsender times out. Only then does Patroni see it
        # gone and drop to async. The default is 60s; 10s bounds the stall at
        # about wal_sender_timeout + loop_wait. Measured in the link-cut drill (docs/lab-results.md).
        wal_sender_timeout: 10s
        wal_receiver_timeout: 10s
        # A dead spare's slot may hold at most this much WAL on the primary.
        max_slot_wal_keep_size: 10GB
        hot_standby: "on"
        max_wal_senders: 10
        max_replication_slots: 10
        max_connections: 150
        shared_buffers: 512MB
        effective_cache_size: 2GB
        work_mem: 8MB
        maintenance_work_mem: 256MB
        autovacuum_work_mem: 128MB
        random_page_cost: 1.1
        effective_io_concurrency: 200
        default_statistics_target: 200
        jit: "off"
        min_wal_size: 512MB
        max_wal_size: 2GB
        checkpoint_completion_target: 0.9
        wal_buffers: 16MB
        wal_compression: zstd
        bgwriter_delay: 50ms
        bgwriter_lru_maxpages: 1000
        autovacuum_vacuum_scale_factor: 0.05
        autovacuum_analyze_scale_factor: 0.02
        autovacuum_vacuum_cost_limit: 2000
        track_io_timing: "on"
        shared_preload_libraries: pg_stat_statements
  initdb:
    - encoding: UTF8
    - data-checksums

postgresql:
  listen: 0.0.0.0:5432
  data_dir: /var/lib/postgresql/data/pgdata
  pgpass: /tmp/pgpass
  # Cloning a replica (join, and the automatic re-clone of a stranded spare)
  # starts with a checkpoint on the primary. pg_basebackup's default is a
  # spread checkpoint, which waits up to checkpoint_timeout x
  # checkpoint_completion_target (about 4.5 min) before copying anything: a
  # 227 MB database took 273 s to join (lab F38). A fast checkpoint costs a
  # short burst of writes on the primary instead.
  basebackup:
    checkpoint: fast
  authentication:
    superuser:
      username: postgres
    replication:
      username: replicator
  pg_hba:
    - local all all trust
    - host all all 127.0.0.1/32 scram-sha-256
    # Patroni also makes local replication connections (seen in the lab on
    # 2026-10-15: "no pg_hba.conf entry for replication connection from host
    # 127.0.0.1"), so replication needs its own loopback rules.
    - host replication replicator 127.0.0.1/32 scram-sha-256
    - host replication replicator ::1/128 scram-sha-256
    - host all all ::1/128 scram-sha-256
    # Fluxer services on the local Compose network.
    - host all all samenet scram-sha-256
    # The two sites' WireGuard addresses (/32 each, never the witness) are
    # appended at start-up by entrypoint.py from FLUXER_HA_SITE_WG_IPS.
    # A whole-mesh rule would let the witness in too (docs/security.md S1c).

watchdog:
  # Hardware-style fencing. If Patroni can't keep renewing its leader lease,
  # the kernel watchdog resets the host before another node can take over.
  # The host provides /dev/watchdog (softdog if there's no hardware one;
  # install loads it), the udev rule hands it to uid 999, and ha.compose.yml
  # passes it in. Lab: a frozen Patroni was reset by softdog in about 22 s.
  mode: required
  device: /dev/watchdog
  safety_margin: 5

tags:
  nofailover: false
  noloadbalance: false
  clonefrom: false
  nosync: false
