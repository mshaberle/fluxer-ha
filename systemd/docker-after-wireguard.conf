# fluxer-ha: rendered by `fluxer-ha install` into
# /etc/systemd/system/docker.service.d/fluxer-ha.conf.
# Orders Docker after WireGuard. At shutdown systemd stops units in reverse
# order, so Docker (and Patroni with it) stops BEFORE the tunnel goes down,
# and the primary sees the standby leave cleanly instead of vanishing.
[Unit]
After=@WG_UNIT@
Wants=@WG_UNIT@
